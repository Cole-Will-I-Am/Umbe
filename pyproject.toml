[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axis"
version = "0.2.0"
description = "AXIS v0.2 — Autonomous eXtrospective Intelligence System (core inference loop)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["axis*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
